name: Continuous Deployment

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deployment-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: jaudiger/reusable-workflows/.github/workflows/deploy-rust-crates-io.yml@3839cfd022d5da89a6c5d3b31f5aa1e9b7fed2ec
    secrets: inherit
