name: Continuous Deployment

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deployment-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: jaudiger/reusable-workflows/.github/workflows/deploy-rust-crates-io.yml@33a0a8da94ca9d6eb9bebea0d3b86af989b883e4
    secrets: inherit
